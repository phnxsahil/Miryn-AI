<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Rich Multi-Stop Linear Gradient -->
    <linearGradient id="miryn-gradient-main" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="25%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="75%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    
    <linearGradient id="miryn-gradient-sub" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="35%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Radial Background Glow Aura -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="#0a0a0a"/>
  <!-- Ambient Gradient Aura -->
  <circle cx="32" cy="32" r="28" fill="url(#bg-glow)"/>

  <!-- Glowing M Monogram Backlight Layer -->
  <path d="M 13 44 C 13 25, 20 14, 27 14 C 31.5 14, 33 22, 32 29 C 31 36, 33.5 44, 38.5 44 C 43.5 44, 48 31, 51 18" stroke="url(#miryn-gradient-main)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#glow)"/>

  <!-- Primary Crisp M Monogram Wave -->
  <path d="M 13 44 C 13 25, 20 14, 27 14 C 31.5 14, 33 22, 32 29 C 31 36, 33.5 44, 38.5 44 C 43.5 44, 48 31, 51 18" stroke="url(#miryn-gradient-main)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Secondary Interlocking Counter Wave -->
  <path d="M 17 46 C 23 46, 27.5 36, 28.5 26 C 29.5 16, 35 14, 40 14 C 47 14, 51 27, 51 41" stroke="url(#miryn-gradient-sub)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Glowing Gradient Accent Nodes -->
  <circle cx="27" cy="14" r="3" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="40" cy="14" r="3" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="32" cy="29" r="2.5" fill="#ffffff"/>
</svg>