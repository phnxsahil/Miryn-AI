name: Backend safety regressions
on:
  pull_request:
    paths: ['miryn/backend/**', '.github/workflows/backend-safety.yml']
  push:
    branches: [main]
    paths: ['miryn/backend/**', '.github/workflows/backend-safety.yml']
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: miryn/backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: miryn/backend
      - run: python scripts/evaluate_safety.py
        working-directory: miryn/backend
