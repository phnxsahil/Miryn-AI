# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Connect your repo → Render will detect this file automatically

services:
  # ───────────────────────────────────────────────
  # 1. Backend API (FastAPI)
  # ───────────────────────────────────────────────
  - type: web
    name: miryn-api
    runtime: docker
    dockerfilePath: ./miryn/backend/Dockerfile
    dockerContext: ./miryn/backend
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      # Database (Neon Postgres — set in Render dashboard)
      - key: DATABASE_URL
        sync: false
      # Redis (Render managed)
      - key: REDIS_URL
        fromService:
          type: redis
          name: miryn-redis
          property: connectionString
# No paid worker, Render Postgres, persistent disk, or separate frontend service.
services:
  - type: web
    name: miryn-api
    runtime: docker
    branch: main
    region: oregon
    plan: free
    dockerfilePath: ./miryn/backend/Dockerfile.render
    dockerContext: ./miryn/backend
    # /health queries Neon. Use / to avoid waking the DB on idle health checks.
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: miryn-redis
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: APP_ENV
        value: production
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: ENABLE_REFLECTION_SYNC_FALLBACK
        value: "false"
      - key: ENABLE_INLINE_CONFLICT_DETECTION
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
  - type: keyvalue
    name: miryn-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    persistenceMode: off
    ipAllowList: []
